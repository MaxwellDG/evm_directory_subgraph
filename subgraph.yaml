specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CCIPRouter
    network: sepolia
    source:
      address: "0x0BF3dE8c5D3e8A2B34D2BEeB17ABfCeBaf363A59"
      abi: CCIPRouter
      startBlock: 9334544
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MessageExecuted
        - OffRampAdded
        - OffRampRemoved
        - OnRampSet
        - OwnershipTransferRequested
        - OwnershipTransferred
      abis:
        - name: CCIPRouter
          file: ./abis/CCIPRouter.json
      eventHandlers:
        - event: MessageExecuted(bytes32,uint64,address,bytes32)
          handler: handleMessageExecuted
        - event: OffRampAdded(indexed uint64,address)
          handler: handleOffRampAdded
        - event: OffRampRemoved(indexed uint64,address)
          handler: handleOffRampRemoved
        - event: OnRampSet(indexed uint64,address)
          handler: handleOnRampSet
        - event: OwnershipTransferRequested(indexed address,indexed address)
          handler: handleOwnershipTransferRequested
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/ccip-router.ts
  # Escrow (UUPS proxy "ParkERC1967Proxy") on Sepolia. Verified implementation:
  # 0xfe836e1d0e2daC6cAbd7B710804Aa9F2bDf8Df40 (all prior implementations emit the
  # same events). Uses Chainlink AggregatorV3 price feeds for USD fee tiers.
  # startBlock = proxy creation block (tx 0xaf25b805...aec90).
  - kind: ethereum
    name: Escrow
    network: sepolia
    source:
      address: "0x1Ad0aD503C0769B97DE1d1B2C25521204C935A6b"
      abi: Escrow
      startBlock: 11766363
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Escrow
        - EscrowEvent
        - EscrowStats
      abis:
        - name: Escrow
          file: ./abis/Escrow.json
      eventHandlers:
        - event: EscrowCreated(indexed uint256,indexed address,address,address,address,address,uint256,uint16,uint16,uint32,bytes32)
          handler: handleEscrowCreated
        - event: SellerAgreed(indexed uint256,indexed address)
          handler: handleSellerAgreed
        - event: EscrowFunded(indexed uint256,indexed address,uint256)
          handler: handleEscrowFunded
        - event: EscrowCancelled(indexed uint256,indexed address)
          handler: handleEscrowCancelled
        - event: Released(indexed uint256,uint256,uint256,uint256)
          handler: handleReleased
        - event: Refunded(indexed uint256,uint256)
          handler: handleRefunded
        - event: DisputeRaised(indexed uint256,indexed uint8,uint64)
          handler: handleDisputeRaised
        - event: DisputeEscalated(indexed uint256,indexed uint8)
          handler: handleDisputeEscalated
        - event: DisputeCancelled(indexed uint256,indexed uint8)
          handler: handleDisputeCancelled
        - event: DisputeResolved(indexed uint256,indexed address,uint16,uint256,uint256,uint256)
          handler: handleDisputeResolved
      file: ./src/escrow.ts
  # Our own Escrow from evm_directory_chain (contracts/Escrow.sol): ETH offers
  # priced with the Chainlink ETH/USD feed, with a settlement period and a
  # Chainlink Automation upkeep that expires unsettled offers.
  # Deployed on Sepolia 2026-10-31, tx 0x3739053ba2d5c7417538585fc068c0165dc7bfa352d24b8d628b774fb0306fb5.
  - kind: ethereum
    name: DirectoryEscrow
    network: sepolia
    source:
      address: "0xEac28EE54c6Ba1F854A7ea696B87392DE5c123e8"
      abi: DirectoryEscrow
      startBlock: 12035203
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EscrowOffer
        - EscrowOfferEvent
        - EscrowOfferStats
      abis:
        - name: DirectoryEscrow
          file: ./abis/DirectoryEscrow.json
      eventHandlers:
        - event: OfferCreated(indexed uint256,indexed address,indexed address,address,uint8,uint256,uint256)
          handler: handleOfferCreated
        - event: OfferAccepted(indexed uint256,indexed address,indexed address,uint256)
          handler: handleOfferAccepted
        - event: OfferCancelled(indexed uint256,indexed address)
          handler: handleOfferCancelled
        - event: SaleExecuted(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleSaleExecuted
        - event: Refunded(indexed uint256,indexed address,indexed address,uint256)
          handler: handleOfferRefunded
        - event: OfferExpired(indexed uint256,indexed address,indexed address,uint256)
          handler: handleOfferExpired
      file: ./src/directory-escrow.ts
